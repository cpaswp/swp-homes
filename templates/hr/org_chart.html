{% extends "hr/base.html" %}{% block heading %}الهيكل التنظيمي{% endblock %}{% block content %}<section class="toolbar"><div><h2>الخريطة التنظيمية</h2><p>عرض هرمي تفاعلي حسب المدير المباشر والوظيفة والإدارة.</p></div><input id="org-search" class="org-search" placeholder="ابحث عن موظف أو وظيفة"></section><section class="panel org-panel"><div id="org-tree" class="org-tree"><p class="empty">جارٍ بناء الهيكل التنظيمي…</p></div></section>{{ nodes|json_script:"org-data" }}{% endblock %}{% block scripts %}<script>
const orgNodes=JSON.parse(document.getElementById('org-data').textContent);const root=document.getElementById('org-tree');function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function renderOrg(filter=''){const byParent={};orgNodes.forEach(n=>{const p=n.manager_id||0;(byParent[p] ||= []).push(n)});let matched=new Set();if(filter){orgNodes.forEach(n=>{if((n.name+' '+n.code+' '+n.title+' '+n.department).toLowerCase().includes(filter.toLowerCase())){let cur=n;while(cur){matched.add(cur.id);cur=orgNodes.find(x=>x.id===cur.manager_id)}}})}function nodeHtml(n,seen=new Set()){if(seen.has(n.id))return '';const next=new Set(seen);next.add(n.id);const kids=(byParent[n.id]||[]).filter(k=>!filter||matched.has(k.id));return '<li><article class="org-card" data-search="'+esc(n.name+' '+n.title+' '+n.department).toLowerCase()+'"><div class="org-avatar">'+esc(n.name.trim().charAt(0))+'</div><b>'+esc(n.name)+'</b><span>'+esc(n.title)+'</span><small>'+esc(n.department)+' · '+esc(n.code)+'</small></article>'+(kids.length?'<ul>'+kids.map(k=>nodeHtml(k,next)).join('')+'</ul>':'')+'</li>'}const roots=orgNodes.filter(n=>!n.manager_id||!orgNodes.some(x=>x.id===n.manager_id));const visible=roots.filter(n=>!filter||matched.has(n.id));root.innerHTML=visible.length?'<ul class="tree-root">'+visible.map(n=>nodeHtml(n)).join('')+'</ul>':'<p class="empty">لا توجد بيانات مطابقة أو لم يتم تعريف مدير مباشر للموظفين.</p>'}renderOrg();document.getElementById('org-search').addEventListener('input',e=>renderOrg(e.target.value.trim()));
</script>{% endblock %}
